<!doctype html>
<html lang="pt-PT" class="dark" data-ui-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Bolt IA</title>
    <script>
      // Tema da INTERFACE aplicado antes da primeira pintura (sem flash). Mesma lógica de
      // src/app/theme.ts: preferência guardada neste browser; sem ela, Escuro.
      (function () {
        var pref = 'dark';
        try {
          var saved = localStorage.getItem('bolt-ia:tema');
          if (saved === 'light' || saved === 'dark' || saved === 'system') pref = saved;
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
        document.documentElement.setAttribute('data-ui-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
